name: Build Rajasthan BLO Directory APK

on:
  workflow_dispatch:
  push:
    paths:
      - "RajasthanBLODirectory_Project.zip"
      - ".github/workflows/build-rajasthan-blo.yml"

permissions:
  contents: read

jobs:
  build-blo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP is present
        run: |
          if [ ! -f "RajasthanBLODirectory_Project.zip" ]; then
            echo "::error::Upload RajasthanBLODirectory_Project.zip to the repository root, then run this workflow again."
            exit 1
          fi

      - name: Extract project
        run: |
          mkdir -p "$RUNNER_TEMP/blo-project"
          unzip -q RajasthanBLODirectory_Project.zip -d "$RUNNER_TEMP/blo-project"
          ANDROID_PROJECT_DIR="$(find "$RUNNER_TEMP/blo-project" -path '*/android/settings.gradle.kts' -print -quit | xargs -r dirname)"
          if [ -z "$ANDROID_PROJECT_DIR" ]; then
            echo "::error::Could not find android/settings.gradle.kts inside the uploaded ZIP."
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$ANDROID_PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p "$ANDROID_PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rajasthan-BLO-Directory-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
