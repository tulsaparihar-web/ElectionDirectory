name: Build Election Contact Directory APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Package full source and APK into one ZIP
        run: |
          mkdir -p release "$RUNNER_TEMP/election-directory-package"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/election-directory-package/Election-Department-Directory-v1.7.apk"
          zip -r release/Election-Department-Directory-Full-Source-and-APK.zip . \
            -x ".git/*" \
               "app/build/*" \
               ".gradle/*" \
               "release/*" \
               "*/build/*"
          zip -j release/Election-Department-Directory-Full-Source-and-APK.zip "$RUNNER_TEMP/election-directory-package/Election-Department-Directory-v1.7.apk"

      - name: Upload combined source and APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Election-Department-Directory-Full-Source-and-APK
          path: release/Election-Department-Directory-Full-Source-and-APK.zip
          if-no-files-found: error


      - name: Upload build reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
